<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full body log</title>
<meta name="description" content="Offline workout logger for a three day full body programme.">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header id="head"></header>
<main id="main" class="gutter"><noscript><p class="empty">Full body log needs JavaScript.</p></noscript></main>
<div id="bar" hidden>
  <div class="bar-prog"></div>
  <div class="gutter bar-in">
    <button class="timer" type="button" data-act="timer"><span class="t-label">Rest</span><span class="t-time">1:30</span></button>
    <button class="primary" type="button" data-act="finish">Finish</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<p id="sr-live" class="visually-hidden" aria-live="assertive"></p>
<input type="file" id="import-file" class="visually-hidden" tabindex="-1" aria-hidden="true">
</body>
</html>
