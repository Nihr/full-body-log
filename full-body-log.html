<title>Full body log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* layout: single-column phone app. sticky header with view switch, one card per exercise holding three set rows, fixed rest-timer bar at the bottom */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f3f5f8; --fg:#171a1f; --muted:#5e6673; --line:#d6dbe2;
  --accent:#1f5ee8; --accent-fg:#ffffff; --good:#1a7f49; --good-bg:#dff2e7; --danger:#b3261e; --shadow:0 1px 2px rgba(23,26,31,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --surface-2:#1f242b; --fg:#eceff3; --muted:#97a0ad; --line:#2a313b;
    --accent:#6b97ff; --accent-fg:#0b1020; --good:#5ccf87; --good-bg:#16301f; --danger:#ff7066; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f242b; --fg:#eceff3; --muted:#97a0ad; --line:#2a313b;
  --accent:#6b97ff; --accent-fg:#0b1020; --good:#5ccf87; --good-bg:#16301f; --danger:#ff7066; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance;line-height:1.05}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
#head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:12px;min-height:52px;padding-block:6px}
.head-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
.link{font-weight:600;font-size:15px;color:var(--accent);padding:8px 2px;min-height:44px}
.link.danger{color:var(--danger)}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.chip-db{color:var(--good);border-color:var(--good)}

/* main */
#main{padding-block:16px 128px;max-width:560px;margin-inline:auto}
.intro{color:var(--muted);font-size:15px;max-width:60ch;margin-bottom:16px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.letter{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;width:48px;height:48px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);color:var(--fg);flex:none}
.letter.small{width:38px;height:38px;font-size:24px;border-radius:8px}
.day .letter{background:var(--fg);color:var(--bg)}
.day.is-next .letter{background:var(--accent);color:var(--accent-fg)}
.day-top{display:flex;align-items:center;gap:12px}
.day-top > div{flex:1;min-width:0}
.day-top h2{font-size:24px}
.day-top p{font-size:14px}
.exlist{color:var(--muted);font-size:14px;margin:10px 0 12px;line-height:1.45}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.resume{display:flex;align-items:center;gap:12px;border-color:var(--accent);margin-bottom:12px}
.resume > div{flex:1;min-width:0}
.resume h2{font-size:24px;margin:2px 0}
.resume p{font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--good);background:var(--good-bg);border-radius:999px;padding:4px 9px;white-space:nowrap}
.day .pill{color:var(--accent);background:transparent;border:1px solid var(--accent)}

.primary{display:block;width:100%;min-height:48px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;padding:0 16px;text-align:center}
.primary.secondary{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.resume .primary{width:auto;flex:none}
.primary.confirming{background:var(--danger);color:#fff}

/* workout */
.started{color:var(--muted);font-size:14px;margin-bottom:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;box-shadow:var(--shadow)}
.ex + .ex{margin-top:12px}
.ex-head{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;margin-bottom:10px}
.ex-head h2{font-size:22px;grid-column:1}
.ex-meta{grid-column:1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.ex-meta .target{font-weight:600;color:var(--fg)}
.ex-head .pill{grid-column:2;grid-row:1 / span 2;align-self:center}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 72px;gap:8px;align-items:center}
.set.noweight{grid-template-columns:24px 1fr 72px}
.set .n{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);text-align:center}
.field{position:relative;display:block;min-width:0}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg);font:inherit;font-size:19px;font-weight:500;padding:0 38px 0 12px;font-variant-numeric:tabular-nums}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.done{height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:15px;color:var(--muted)}
.set.is-done .done{background:var(--good);border-color:var(--good);color:#fff}
.set.is-done input{opacity:.75}

/* history */
.hist-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.hist-top > div{flex:1;min-width:0}
.hist-top h2{font-size:21px}
.hist-top p{font-size:13px}
.hist-list{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.hist-list li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px solid var(--line)}
.hist-list .nums{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-prog{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--accent);transition:width .25s linear}
.bar-in{display:flex;align-items:center;gap:12px;min-height:64px;padding-block:8px;max-width:560px;margin-inline:auto}
.timer{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;min-height:48px;border-radius:10px;padding:0 12px;background:var(--surface-2);border:1px solid var(--line);text-align:left}
.timer.on{border-color:var(--accent)}
.timer.go{border-color:var(--good);background:var(--good-bg)}
.t-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer.go .t-label{color:var(--good)}
.t-time{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.bar-in .primary{width:auto;flex:none;padding:0 20px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:12;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

<header id="head"></header>
<main id="main"></main>
<div id="bar" hidden>
  <div class="bar-prog"></div>
  <div class="gutter bar-in">
    <button class="timer" type="button" data-act="timer"><span class="t-label">Rest</span><span class="t-time">0:00</span></button>
    <button class="primary" type="button" data-act="finish">Finish</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var SETS=3;
var PLAN=[
 {id:'A',ex:[
  {k:'squat',n:'Squat',t:10,inc:5,rest:150},
  {k:'bench',n:'Bench press',t:10,inc:2.5,rest:150},
  {k:'row',n:'Machine row',t:10,inc:5,rest:120},
  {k:'rdl',n:'Romanian deadlift',t:10,inc:5,rest:120},
  {k:'latraise',n:'Lateral raise',t:10,inc:1,rest:60},
  {k:'curl',n:'Barbell curl',t:10,inc:2.5,rest:60},
  {k:'pushdown',n:'Triceps pushdown',t:10,inc:2.5,rest:60},
  {k:'legraise',n:'Hanging leg raise',t:0,bw:'none',rest:60}
 ]},
 {id:'B',ex:[
  {k:'legpress',n:'Leg press',t:10,inc:10,rest:150},
  {k:'incdb',n:'Incline dumbbell press',t:10,inc:2,rest:120},
  {k:'pulldown',n:'Lat pulldown',t:10,inc:5,rest:120},
  {k:'legcurl',n:'Lying leg curl',t:10,inc:5,rest:90},
  {k:'dbpress',n:'Dumbbell shoulder press',t:10,inc:2,rest:120},
  {k:'hammer',n:'Hammer curl',t:10,inc:2,rest:60},
  {k:'ohext',n:'Overhead cable triceps extension',t:10,inc:2.5,rest:60},
  {k:'calfstand',n:'Standing calf raise',t:10,inc:5,rest:60}
 ]},
 {id:'C',ex:[
  {k:'deadlift',n:'Deadlift',t:6,inc:5,rest:180},
  {k:'legext',n:'Leg extension',t:10,inc:5,rest:90},
  {k:'fly',n:'Cable fly or machine chest press',t:10,inc:2.5,rest:90},
  {k:'pullups',n:'Pull-ups',t:0,goal:10,inc:2.5,bw:'add',rest:120},
  {k:'reardelt',n:'Rear delt fly',t:10,inc:1,rest:60},
  {k:'incurl',n:'Incline dumbbell curl',t:10,inc:2,rest:60},
  {k:'dips',n:'Dips',t:10,inc:2.5,bw:'add',rest:120},
  {k:'calfseat',n:'Seated calf raise',t:10,inc:5,rest:60},
  {k:'abwheel',n:'Ab wheel rollout',t:10,bw:'none',rest:60}
 ]}
];
var EX={};
PLAN.forEach(function(d){d.ex.forEach(function(e){e.day=d.id;EX[e.k]=e;});});
var LS_S='fbl_sessions',LS_D='fbl_draft';

var state={view:'home',sessions:[],draft:null,storage:'loading',confirmKey:null,confirmTimer:null};
var headEl=document.getElementById('head'),main=document.getElementById('main'),bar=document.getElementById('bar'),toastEl=document.getElementById('toast');
var barProg=bar.querySelector('.bar-prog'),timerBtn=bar.querySelector('.timer'),tLabel=bar.querySelector('.t-label'),tTime=bar.querySelector('.t-time');

/* helpers */
function ls(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function num(v){if(v==null||v==='')return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function fmtW(w){return w==null?'':String(Math.round(w*100)/100);}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function ago(ts){var d=Math.floor((Date.now()-ts)/86400000);return d<=0?'today':d===1?'yesterday':d+' days ago';}
function mmss(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function startedLabel(ts){return new Date(ts).toDateString()===new Date().toDateString()?fmtTime(ts):fmtDate(ts)+' '+fmtTime(ts);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dayOf(id){for(var i=0;i<PLAN.length;i++)if(PLAN[i].id===id)return PLAN[i];return PLAN[0];}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove('show');},2600);}

function lastFor(k){for(var i=0;i<state.sessions.length;i++){var r=state.sessions[i].sets&&state.sessions[i].sets[k];if(r&&r.length)return {ts:state.sessions[i].ts,sets:r};}return null;}
function lastDone(day){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].day===day)return state.sessions[i];return null;}
function nextDay(){if(!state.sessions.length)return 'A';var order=['A','B','C'],i=order.indexOf(state.sessions[0].day);return order[(i+1)%3];}
function suggest(ex,last){
  var goal=ex.t||ex.goal||0;
  if(!last||ex.bw==='none'||!goal)return {w:null,add:false};
  var ws=[];last.sets.forEach(function(s){if(s.w!=null)ws.push(s.w);});
  var w=ws.length?Math.max.apply(null,ws):null;
  var hit=last.sets.length>=SETS;
  for(var i=0;i<last.sets.length;i++)if((last.sets[i].r||0)<goal)hit=false;
  if(hit){var base=w==null?0:w;return {w:base+ex.inc,add:true};}
  if(ex.bw==='add'&&!w)return {w:null,add:false};
  return {w:w,add:false};
}
function fmtSets(ex,sets){
  var reps=sets.map(function(s){return s.r;}).join(', ');
  if(ex.bw==='none')return reps;
  var ws=sets.map(function(s){return s.w==null?0:s.w;}),same=true;
  for(var i=1;i<ws.length;i++)if(ws[i]!==ws[0])same=false;
  if(same){var w=ws[0];var label=w===0?(ex.bw==='add'?'bodyweight':'0 kg'):(ex.bw==='add'?'+':'')+fmtW(w)+' kg';return label+' · '+reps;}
  return sets.map(function(s){var w=s.w==null?0:s.w;return (w===0&&ex.bw==='add'?'bw':fmtW(w))+'×'+s.r;}).join(', ');
}

/* draft */
function newDraft(day){
  var d={day:day,started:Date.now(),sets:{}};
  dayOf(day).ex.forEach(function(e){
    var sg=suggest(e,lastFor(e.k));d.sets[e.k]=[];
    for(var i=0;i<SETS;i++)d.sets[e.k].push({w:sg.w,r:null,done:false});
  });
  return d;
}
function normalizeDraft(){
  var d=state.draft;if(!d)return;
  var keep={};
  dayOf(d.day).ex.forEach(function(e){
    var arr=d.sets&&d.sets[e.k];
    if(!arr||!arr.length){var sg=suggest(e,lastFor(e.k));arr=[];for(var i=0;i<SETS;i++)arr.push({w:sg.w,r:null,done:false});}
    while(arr.length<SETS)arr.push({w:null,r:null,done:false});
    keep[e.k]=arr.slice(0,SETS);
  });
  d.sets=keep;
}
function saveDraft(){lsSet(LS_D,state.draft);}
function draftCount(){var n=0,s=state.draft.sets;Object.keys(s).forEach(function(k){s[k].forEach(function(x){if(x.r>0)n++;});});return n;}

/* storage */
var store={
  coll:null,unsub:null,
  init:function(){
    var self=this;
    var c=window.claude;
    if(!c||typeof c.use!=='function'){self.local();return;}
    Promise.all([c.use('db'),c.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user)return self.local();
      return user.id().then(function(uid){
        if(!uid)return self.local();
        self.coll=db.doc('data/users/'+uid+'/log').collection('sessions');
        self.unsub=self.coll.orderBy('ts','desc').limit(200).onSnapshot(function(snap){
          state.sessions=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});
          state.sessions.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
          if(state.storage!=='db'){state.storage='db';}
          onSessions();
        },function(){self.local();});
      });
    }).catch(function(){self.local();});
  },
  local:function(){
    state.storage='local';
    state.sessions=(ls(LS_S)||[]).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    onSessions();
  },
  save:function(session){
    var self=this;
    if(state.storage==='db'&&self.coll){
      return self.coll.doc(session.id).set(session).then(function(){return 'db';}).catch(function(){self.saveLocal(session);return 'local';});
    }
    self.saveLocal(session);return Promise.resolve('local');
  },
  saveLocal:function(session){
    var all=(ls(LS_S)||[]).filter(function(s){return s.id!==session.id;});all.push(session);lsSet(LS_S,all);
    if(state.storage!=='db'){state.sessions=all.sort(function(a,b){return (b.ts||0)-(a.ts||0);});}
  },
  remove:function(id){
    var self=this;
    state.sessions=state.sessions.filter(function(s){return s.id!==id;});
    if(state.storage==='db'&&self.coll){return self.coll.doc(id).delete().catch(function(){toast('Could not delete');});}
    lsSet(LS_S,(ls(LS_S)||[]).filter(function(s){return s.id!==id;}));return Promise.resolve();
  }
};
function storageLabel(){return state.storage==='db'?'Synced':state.storage==='local'?'This device only':'Connecting';}
function onSessions(){
  if(state.view==='home')renderHome();
  else if(state.view==='history')renderHistory();
  else refreshWorkoutMeta();
}

/* rest timer */
var timer={id:null,end:0,total:0,done:false};
var actx=null;
function primeAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  try{if(!actx)return;var t=actx.currentTime;[0,0.3].forEach(function(off){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,t+off);g.gain.exponentialRampToValueAtTime(0.25,t+off+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.22);o.start(t+off);o.stop(t+off+0.25);});}catch(e){}
}
function startTimer(sec){clearInterval(timer.id);timer.end=Date.now()+sec*1000;timer.total=sec;timer.done=false;timer.id=setInterval(tick,250);tick();}
function stopTimer(){clearInterval(timer.id);timer.id=null;timer.done=false;paintTimer(0,0,'idle');}
function tick(){
  var left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  var pct=timer.total?100*(1-left/timer.total):0;
  if(left<=0){clearInterval(timer.id);timer.id=null;if(!timer.done){timer.done=true;beep();}paintTimer(0,100,'go');return;}
  paintTimer(left,pct,'on');
}
function paintTimer(left,pct,mode){
  barProg.style.width=pct+'%';
  timerBtn.classList.toggle('on',mode==='on');timerBtn.classList.toggle('go',mode==='go');
  tLabel.textContent=mode==='on'?'Rest':mode==='go'?'Go':'Rest';
  tTime.textContent=mode==='on'?mmss(left):mode==='go'?'0:00':'0:00';
}

/* wake lock */
var wake=null;
function wakeOn(){try{if(navigator.wakeLock&&state.view==='workout'){navigator.wakeLock.request('screen').then(function(l){wake=l;}).catch(function(){});}}catch(e){}}
function wakeOff(){try{if(wake){wake.release();wake=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wakeOn();});

/* two-step confirm */
function confirmStep(btn,key,label){
  if(state.confirmKey===key){clearTimeout(state.confirmTimer);state.confirmKey=null;return true;}
  state.confirmKey=key;btn.dataset.orig=btn.textContent;btn.textContent=label;btn.classList.add('confirming');
  clearTimeout(state.confirmTimer);
  state.confirmTimer=setTimeout(function(){if(btn.isConnected){btn.textContent=btn.dataset.orig;btn.classList.remove('confirming');}state.confirmKey=null;},4000);
  return false;
}

/* views */
function go(view){state.view=view;state.confirmKey=null;if(view==='workout')wakeOn();else{wakeOff();stopTimer();}
  if(view==='home')renderHome();else if(view==='history')renderHistory();else renderWorkout();
  window.scrollTo(0,0);
}
function renderHome(){
  headEl.innerHTML='<div class="gutter head-in"><div class="head-title">Full body log</div><span class="chip chip-'+state.storage+'">'+storageLabel()+'</span><button class="link" type="button" data-act="history">History</button></div>';
  var next=nextDay(),html='<p class="intro">3 × 10 on everything, deadlift 3 × 6, leg raise and pull-ups to failure. Hit the number on all three sets and the weight goes up next time.</p>';
  if(state.draft){
    html+='<section class="card resume"><div><div class="eyebrow">In progress</div><h2>Day '+state.draft.day+'</h2><p class="muted">Started '+startedLabel(state.draft.started)+', '+draftCount()+' sets logged</p></div><button class="primary" type="button" data-act="resume">Resume</button></section>';
  }
  PLAN.forEach(function(d){
    var last=lastDone(d.id),isNext=d.id===next&&!state.draft;
    html+='<section class="card day'+(isNext?' is-next':'')+'"><div class="day-top"><span class="letter">'+d.id+'</span><div><h2>Day '+d.id+'</h2><p class="muted">'+(last?'Last done '+fmtDate(last.ts)+', '+ago(last.ts):(state.storage==='loading'?'Loading':'Not done yet'))+'</p></div>'+(isNext?'<span class="pill">Next up</span>':'')+'</div><p class="exlist">'+d.ex.map(function(e){return e.n;}).join(', ')+'</p><button class="primary'+(isNext?'':' secondary')+'" type="button" data-act="start" data-day="'+d.id+'">Start Day '+d.id+'</button></section>';
  });
  main.innerHTML=html;bar.hidden=true;
}
function renderHistory(){
  headEl.innerHTML='<div class="gutter head-in"><button class="link" type="button" data-act="home">Back</button><div class="head-title">History</div><span class="chip chip-'+state.storage+'">'+storageLabel()+'</span></div>';
  if(!state.sessions.length){main.innerHTML='<p class="empty">'+(state.storage==='loading'?'Loading':'No sessions yet.')+'</p>';bar.hidden=true;return;}
  var html='';
  state.sessions.forEach(function(s){
    var day=dayOf(s.day),rows='',n=0;
    day.ex.forEach(function(e){var r=s.sets&&s.sets[e.k];if(r&&r.length){n+=r.length;rows+='<li><span>'+esc(e.n)+'</span><span class="nums">'+esc(fmtSets(e,r))+'</span></li>';}});
    html+='<section class="card"><div class="hist-top"><span class="letter small">'+esc(s.day)+'</span><div><h2>'+fmtDate(s.ts)+'</h2><p class="muted">'+fmtTime(s.ts)+' · '+n+' sets</p></div><button class="link danger" type="button" data-act="del" data-id="'+esc(s.id)+'">Delete</button></div><ul class="hist-list">'+rows+'</ul></section>';
  });
  main.innerHTML=html;bar.hidden=true;
}
function renderWorkout(){
  if(!state.draft){go('home');return;}
  normalizeDraft();
  var d=state.draft,day=dayOf(d.day);
  headEl.innerHTML='<div class="gutter head-in"><button class="link" type="button" data-act="home">Back</button><div class="head-title"><span class="letter small">'+day.id+'</span>Day '+day.id+'</div><button class="link danger" type="button" data-act="discard">Discard</button></div>';
  var html='<p class="started">Started '+startedLabel(d.started)+'. Tap Done after each set to start the rest timer. Finish saves it under that date.</p>';
  day.ex.forEach(function(e){html+=renderEx(e);});
  main.innerHTML=html;
  bar.hidden=false;paintTimer(0,0,'idle');
}
function renderEx(e){
  var last=lastFor(e.k),sg=suggest(e,last);
  var target=SETS+' × '+(e.t?e.t:'max')+(e.goal?', add weight at '+e.goal:'');
  var lastTxt=last?fmtDate(last.ts)+' · '+fmtSets(e,last.sets):(state.storage==='loading'?'Loading last session':'First time');
  var rows='';
  state.draft.sets[e.k].forEach(function(s,i){rows+=renderSet(e,s,i);});
  return '<section class="ex" data-ex="'+e.k+'"><div class="ex-head"><h2>'+esc(e.n)+'</h2><div class="ex-meta"><span class="target">'+target+'</span><span class="last" data-last="'+e.k+'">'+esc(lastTxt)+'</span></div><span class="pill" data-pill="'+e.k+'"'+(sg.add?'':' hidden')+'>Add weight: '+fmtW(sg.w)+' kg</span></div><div class="sets">'+rows+'</div></section>';
}
function renderSet(e,s,i){
  var unit=e.bw==='add'?'+kg':'kg';
  var w=e.bw==='none'?'':'<label class="field"><input type="text" inputmode="decimal" id="w-'+e.k+'-'+i+'" data-f="w" value="'+(s.w==null?'':fmtW(s.w))+'" placeholder="'+unit+'" autocomplete="off"><span>'+unit+'</span></label>';
  var r='<label class="field"><input type="text" inputmode="numeric" id="r-'+e.k+'-'+i+'" data-f="r" value="'+(s.r==null?'':s.r)+'" placeholder="'+(e.t?e.t:'max')+'" autocomplete="off"><span>reps</span></label>';
  return '<div class="set'+(e.bw==='none'?' noweight':'')+(s.done?' is-done':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+w+r+'<button class="done" type="button" data-act="done" aria-pressed="'+(s.done?'true':'false')+'">Done</button></div>';
}
function refreshWorkoutMeta(){
  if(state.view!=='workout'||!state.draft)return;
  dayOf(state.draft.day).ex.forEach(function(e){
    var last=lastFor(e.k),sg=suggest(e,last);
    var l=main.querySelector('[data-last="'+e.k+'"]');if(l)l.textContent=last?fmtDate(last.ts)+' · '+fmtSets(e,last.sets):'First time';
    var p=main.querySelector('[data-pill="'+e.k+'"]');if(p){p.hidden=!sg.add;if(sg.add)p.textContent='Add weight: '+fmtW(sg.w)+' kg';}
    state.draft.sets[e.k].forEach(function(s,i){
      if(s.w==null&&sg.w!=null&&!s.done){s.w=sg.w;var inp=document.getElementById('w-'+e.k+'-'+i);if(inp&&inp.value==='')inp.value=fmtW(sg.w);}
    });
  });
  saveDraft();
}

/* actions */
function finish(){
  var d=state.draft,sets={},any=false;
  dayOf(d.day).ex.forEach(function(e){
    var arr=[];d.sets[e.k].forEach(function(s){if(s.r>0){arr.push({w:e.bw==='none'?null:(s.w==null?(e.bw==='add'?0:null):s.w),r:s.r});}});
    if(arr.length){sets[e.k]=arr;any=true;}
  });
  if(!any){toast('Nothing logged yet');return;}
  var ts=d.started||Date.now(),session={id:'s'+Date.now(),day:d.day,ts:ts,date:new Date(ts).toISOString(),sets:sets};
  var btn=bar.querySelector('[data-act="finish"]');btn.disabled=true;
  store.save(session).then(function(where){
    if(state.storage==='db'&&where==='db'){var seen=state.sessions.some(function(s){return s.id===session.id;});if(!seen){state.sessions.unshift(session);}}
    state.draft=null;lsSet(LS_D,null);btn.disabled=false;
    go('home');toast(where==='db'?'Saved. Next up: Day '+nextDay():'Saved on this device. Next up: Day '+nextDay());
  });
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act;
  if(act==='home'){go('home');return;}
  if(act==='history'){go('history');return;}
  if(act==='resume'){go('workout');return;}
  if(act==='start'){
    var day=b.dataset.day;
    if(state.draft&&state.draft.day!==day){if(!confirmStep(b,'start'+day,'Tap again to drop Day '+state.draft.day))return;}
    if(!state.draft||state.draft.day!==day){state.draft=newDraft(day);saveDraft();}
    go('workout');return;
  }
  if(act==='discard'){
    if(!confirmStep(b,'discard','Tap again to discard'))return;
    state.draft=null;lsSet(LS_D,null);go('home');toast('Workout discarded');return;
  }
  if(act==='del'){
    if(!confirmStep(b,'del'+b.dataset.id,'Tap again to delete'))return;
    store.remove(b.dataset.id);renderHistory();return;
  }
  if(act==='finish'){finish();return;}
  if(act==='timer'){primeAudio();if(timer.id)stopTimer();else startTimer(90);return;}
  if(act==='done'){
    primeAudio();
    var set=b.closest('.set'),exEl=b.closest('.ex'),e=EX[exEl.dataset.ex],i=+set.dataset.i,s=state.draft.sets[e.k][i];
    s.done=!s.done;
    if(s.done){
      if(s.r==null&&e.t){s.r=e.t;var ri=document.getElementById('r-'+e.k+'-'+i);if(ri)ri.value=e.t;}
      if(e.bw!=='none'){var arr=state.draft.sets[e.k];for(var j=i+1;j<arr.length;j++){if(arr[j].w==null&&s.w!=null&&!arr[j].done){arr[j].w=s.w;var wi=document.getElementById('w-'+e.k+'-'+j);if(wi&&wi.value==='')wi.value=fmtW(s.w);}}}
      startTimer(e.rest||90);
    }
    set.classList.toggle('is-done',s.done);b.setAttribute('aria-pressed',s.done?'true':'false');
    saveDraft();
  }
});
main.addEventListener('input',function(ev){
  var inp=ev.target;if(!inp.dataset||!inp.dataset.f||!state.draft)return;
  var set=inp.closest('.set'),exEl=inp.closest('.ex');if(!set||!exEl)return;
  var s=state.draft.sets[exEl.dataset.ex][+set.dataset.i];
  if(inp.dataset.f==='w')s.w=num(inp.value);else{var n=num(inp.value);s.r=n==null?null:Math.round(n);}
  saveDraft();
});

/* boot */
function start(data){
  var d=ls(LS_D);
  if(d&&d.started&&d.sets){state.draft=d;normalizeDraft();}else lsSet(LS_D,null);
  window.addEventListener('error',function(ev){toast('Error: '+(ev.message||'something went wrong'));});
  if(data&&data.view==='workout'&&state.draft)go('workout');
  else if(data&&data.view==='history')go('history');
  else go('home');
  store.init();
  try{var h=window.claude&&window.claude.hot;if(h&&typeof h.snapshot==='function')h.snapshot(function(){return {view:state.view};});}catch(e){}
}
var hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
